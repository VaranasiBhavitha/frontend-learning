<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #555;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }

        .login-container{
            background-color: #fff;
            width: 350px;
            padding: 40px;
            border-radius: 8px;
        }

        .login-header{
            text-align: center;
        }
        .login-header h1{
            font-size: 26px;
            margin-bottom: 10px;
        }

        .input-group input
        {
            width: 100%;
            padding: 12px 20px;
            box-sizing: border-box;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .button-group{
            display: flex;
            justify-content: space-around;
        }

        .btn{
            font-size: 16px;
            font-weight: 600;
            padding: 12px 16px;
            width: 100%;
            margin: 5px;
        }

        .login-btn{
            margin-left: 10px;
            background-color: #3e3bea;
            color: #fff;
        }
        .reset-btn{
            background-color: #555;
            color: #fff;
        }
    </style>
</head>
<body>
   <div class="login-container">
        <div class="login-header">
            <h1>Login Page</h1>
            <p>Admin Panel Login</p>
        </div>

        <form action="#" method="#" enctype="#">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" class="username" placeholder="Enter your Username">
            </div>
            <div class="input-group">
                <label for="password">password</label>
                <input type="password" name="password" id="password" class="password" placeholder="Enter your Password">
            </div>
            <div class="button-group">
                <button type="submit" class="btn login-btn">Login </button>
                <button type="reset" class="btn reset-btn">Reset</button>
            </div>
        </form>
   </div>
</body>
</html>
